<style>
/* Layout concept: a black room lit by drifting deep sea blue light, with the
   content set as a compact editorial CV on panes of liquid glass. Single dark world. */
:root{
  color-scheme: dark;
  --bg:#020306;
  --ink:#F5F5F5;
  --ink-2:#A3A3A3;
  --ink-3:#6B6B6B;            /* decorative only */
  --sea:#0B4C7E;              /* deep sea blue: fills and buttons, white text */
  --sea-hi:#1265A3;           /* button hover */
  --sea-deep:#06263F;
  --tide:#7CC4F2;             /* sea tint for text on black, AA safe */
  --glow:rgba(18,101,163,.55);
  --on-sea:#FFFFFF;
  --glass:rgba(255,255,255,.055);
  --glass-strong:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.08);
  --shadow:0 24px 60px -24px rgba(0,0,0,.85), 0 2px 6px rgba(0,0,0,.4);
  --hl-top:inset 0 1px 0 rgba(255,255,255,.18);
  --font-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:32px; --r-md:24px; --r-sm:14px;
  --step-0:clamp(.98rem,.95rem + .15vw,1.06rem);
  --step-1:clamp(1.1rem,1.04rem + .3vw,1.28rem);
  --step-2:clamp(1.35rem,1.2rem + .6vw,1.75rem);
  --step-3:clamp(1.9rem,1.5rem + 1.8vw,3rem);
  --step-4:clamp(2.3rem,1.6rem + 3.6vw,4.4rem);
  --ease:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--step-0);line-height:1.7;overflow-x:clip;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:var(--tide);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:#A9D9F7}
:focus-visible{outline:2px solid var(--tide);outline-offset:3px;border-radius:8px}
.hl{font-style:normal;color:var(--tide);text-shadow:0 0 30px var(--glow)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;z-index:200;background:var(--sea);color:var(--on-sea);padding:10px 16px;border-radius:10px;font-family:var(--font-display);font-weight:700}
.skip:focus{top:12px}

/* ambient light */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.7;will-change:transform}
.blob.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle,rgba(11,76,126,.6),rgba(11,76,126,0) 65%);animation:drift1 38s ease-in-out infinite alternate}
.blob.b2{width:38vmax;height:38vmax;right:-12vmax;top:28vh;background:radial-gradient(circle,rgba(18,101,163,.45),rgba(18,101,163,0) 65%);animation:drift2 44s ease-in-out infinite alternate}
.blob.b3{width:30vmax;height:30vmax;left:22vw;bottom:-14vmax;background:radial-gradient(circle,rgba(6,38,63,.6),rgba(6,38,63,0) 65%);animation:drift3 52s ease-in-out infinite alternate}
.blob.b4{width:18vmax;height:18vmax;left:58vw;top:6vh;background:radial-gradient(circle,rgba(124,196,242,.22),rgba(124,196,242,0) 65%);animation:drift2 60s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(18vw,22vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(-20vw,-14vh) scale(.9)}}
@keyframes drift3{to{transform:translate(16vw,-26vh) scale(1.15)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.page{position:relative;z-index:2}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}

/* glass */
.glass{position:relative;background:linear-gradient(160deg,var(--glass-strong),var(--glass) 55%);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--hl-top),var(--shadow)}
.glass.lg{border-radius:var(--r-lg)}
.sheen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.10),rgba(255,255,255,.03) 35%,transparent 60%)}
.sheen:hover::after{opacity:1}
.liquid{border-color:transparent}
.liquid::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 0 22px rgba(255,255,255,.035);filter:url(#liquid);pointer-events:none}

/* buttons */
.btn{--h:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--h);padding:0 22px;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:.9rem;letter-spacing:.01em;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .35s var(--ease),background-color .25s,box-shadow .35s,color .25s,border-color .25s;white-space:nowrap}
.btn-primary{background:var(--sea);color:var(--on-sea);box-shadow:0 10px 30px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:hover{background:var(--sea-hi);color:var(--on-sea);transform:translateY(-1px);box-shadow:0 16px 40px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--ink);border-color:var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn-ghost:hover{border-color:var(--tide);color:var(--tide)}
.btn-sm{--h:38px;padding:0 16px;font-size:.8rem}
.btn svg{width:16px;height:16px;flex:none}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-top:14px}
.bar{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 8px 8px 22px;border-radius:999px}
.logo{font-family:var(--font-display);font-weight:800;font-size:1.25rem;letter-spacing:-.04em;color:var(--ink);text-decoration:none;margin-right:auto}
.logo span{color:var(--tide)}
.logo:hover{color:var(--ink)}
.nav{display:none;gap:2px}
.nav a{font-family:var(--font-display);font-weight:600;font-size:.84rem;color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:999px;transition:color .2s,background-color .2s}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.nav a[aria-current="true"]{color:var(--tide);background:rgba(255,255,255,.06)}
.bar .btn-primary{display:none}
.menu-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.menu-btn svg{width:20px;height:20px}
.mobile-nav{margin-top:8px;padding:10px;border-radius:var(--r-md);display:grid;gap:2px}
.mobile-nav a{font-family:var(--font-display);font-weight:600;color:var(--ink);text-decoration:none;padding:12px 14px;border-radius:12px}
.mobile-nav a:hover{background:rgba(255,255,255,.06);color:var(--tide)}
.mobile-nav .btn{margin-top:8px;color:var(--on-sea)}
@media (min-width:980px){
  .nav{display:flex}
  .bar .btn-primary{display:inline-flex}
  .menu-btn,.mobile-nav{display:none!important}
}

/* sections */
section{scroll-margin-top:96px}
.section{padding-block:clamp(56px,7vw,96px)}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--tide)}
.h2{font-size:var(--step-3);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.lead{color:var(--ink-2);max-width:62ch;font-size:var(--step-1);line-height:1.6}
.section-head{display:grid;gap:14px;margin-bottom:clamp(28px,4vw,44px)}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(16px,2.4vw,28px)}
.grid12>*{grid-column:1/-1;min-width:0}
.label-sm{font-family:var(--font-display);font-weight:600;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

/* hero */
.hero{padding-block:clamp(44px,7vw,88px) clamp(32px,4vw,48px)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:999px;font-family:var(--font-display);font-weight:600;font-size:.8rem;color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--tide);box-shadow:0 0 0 4px rgba(18,101,163,.25),0 0 14px var(--glow)}
.hero h1{font-size:var(--step-4);font-weight:800;letter-spacing:-.045em;line-height:1.02;margin-top:24px;max-width:17ch}
.hero-body{margin-top:clamp(28px,4vw,44px);align-items:stretch}
.bio{padding:clamp(22px,3.2vw,36px)}
.bio p{max-width:68ch}
.bio p+p{margin-top:.9em}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
/* portrait with floating facts */
.portrait{position:relative;overflow:hidden;min-height:440px;padding:0;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;z-index:-2}
.portrait .fallback{position:absolute;inset:0;z-index:-3;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 20%,rgba(18,101,163,.55),rgba(6,38,63,.6) 45%,rgba(2,3,6,.95) 85%)}
.portrait .fallback span{font-family:var(--font-display);font-weight:800;font-size:clamp(5rem,4rem + 6vw,9rem);letter-spacing:-.06em;color:rgba(255,255,255,.12);margin-bottom:30%}
.portrait::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,3,6,0) 35%,rgba(2,3,6,.55) 65%,rgba(2,3,6,.92));border-radius:inherit;pointer-events:none}
.floats{display:grid;gap:10px;padding:16px;margin:0}
.float{padding:14px 16px;border-radius:18px;background:rgba(10,16,24,.45);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.16);box-shadow:var(--hl-top),0 12px 30px -12px rgba(0,0,0,.7)}
.float dt{font-family:var(--font-display);font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tide)}
.float dd{margin:2px 0 0;line-height:1.45;font-size:.93rem;color:var(--ink)}
.float:nth-child(2){margin-left:18%}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 7s ease-in-out infinite}
  .float:nth-child(2){animation-delay:-3.5s}
}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (min-width:900px){
  .hero-body .bio{grid-column:1/span 8}
  .hero-body .portrait{grid-column:9/span 4;min-height:100%}
}

/* tracka UI mockup */
.ui-thumb{height:210px;overflow:hidden;border-radius:16px;display:flex;justify-content:center;padding-top:16px;background:radial-gradient(90% 90% at 50% 0%,rgba(18,101,163,.35),rgba(255,255,255,.02) 70%);border:1px solid var(--line-soft);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.ui-row{display:flex;gap:18px;overflow-x:auto;padding:8px 2px 14px;scroll-snap-type:x mandatory}
.ui-row .phone{scroll-snap-align:start;flex:none}
.phone{--w:224px;width:var(--w);aspect-ratio:9/19;border-radius:34px;border:6px solid #141A22;background:#080D14;box-shadow:0 30px 60px -25px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.06);position:relative;overflow:hidden;font-family:var(--font-body);color:#EAF2FA;font-size:10px;line-height:1.35;flex:none}
.phone.sm{--w:186px}
.tk-notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:34%;height:16px;border-radius:999px;background:#141A22;z-index:2}
.tk-screen{position:absolute;inset:0;padding:30px 12px 54px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.tk-top{display:flex;justify-content:space-between;align-items:center}
.tk-top small{color:#8A9BB0;font-size:8.5px;display:block}
.tk-top b{font-family:var(--font-display);font-size:13px;letter-spacing:-.02em}
.tk-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#1265A3,#5EE6B0)}
.tk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.tk-days span{padding:5px 0;border-radius:9px;background:#101823;font-size:8px;color:#8A9BB0}
.tk-days span b{display:block;font-size:10px;color:#EAF2FA;font-family:var(--font-display)}
.tk-days span.on{background:#1265A3;color:#D6ECFB}
.tk-hero{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:linear-gradient(135deg,#0B4C7E,#0A2E4C)}
.tk-ringc{--p:66;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#5EE6B0 calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.tk-ringc span{width:36px;height:36px;border-radius:50%;background:#0A3557;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:10px}
.tk-hero b{font-family:var(--font-display);font-size:11px;display:block}
.tk-hero small{color:#B5D3EA;font-size:8.5px}
.tk-h{font-family:var(--font-display);font-weight:700;font-size:10px;color:#8A9BB0;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.tk-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:11px;background:#101823;border:1px solid rgba(255,255,255,.05)}
.tk-chk{width:15px;height:15px;border-radius:5px;border:1.5px solid #3A4B60;flex:none;display:grid;place-items:center}
.tk-item.done .tk-chk{background:#5EE6B0;border-color:#5EE6B0}
.tk-item.done .tk-chk::after{content:"";width:6px;height:3px;border-left:1.5px solid #06261A;border-bottom:1.5px solid #06261A;transform:rotate(-45deg) translate(1px,-1px)}
.tk-item.done .tk-name{color:#8A9BB0;text-decoration:line-through}
.tk-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-name small{display:block;color:#8A9BB0;font-size:8px;text-decoration:none}
.tk-streak{font-family:var(--font-display);font-weight:700;font-size:8.5px;color:#FFC36B;background:rgba(255,195,107,.1);padding:2px 6px;border-radius:999px}
.tk-goal{padding:9px 10px;border-radius:12px;background:#101823;border:1px solid rgba(255,255,255,.05);display:grid;gap:6px}
.tk-goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tk-goal b{font-family:var(--font-display);font-size:10.5px}
.tk-goal small{color:#8A9BB0;font-size:8px}
.tk-bar{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.tk-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#1265A3,#5EE6B0)}
.tk-tag{font-size:7.5px;font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7CC4F2}
.tk-tl{display:grid;gap:6px;position:relative;padding-left:14px}
.tk-tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1.5px;background:#1E2C3D}
.tk-slot{position:relative;padding:7px 9px;border-radius:11px;background:#101823;display:flex;justify-content:space-between;gap:6px}
.tk-slot::before{content:"";position:absolute;left:-13px;top:10px;width:8px;height:8px;border-radius:50%;background:#080D14;border:1.5px solid #3A4B60}
.tk-slot.now{background:#0B4C7E}
.tk-slot.now::before{border-color:#5EE6B0;background:#5EE6B0}
.tk-slot.past{opacity:.55}
.tk-slot b{font-family:var(--font-display);font-size:10px;display:block}
.tk-slot small{color:#8A9BB0;font-size:8px}
.tk-slot.now small{color:#B5D3EA}
.tk-time{font-family:var(--font-display);font-weight:700;font-size:8.5px;color:#8A9BB0;white-space:nowrap}
.tk-slot.now .tk-time{color:#D6ECFB}
.tk-tabs{position:absolute;left:8px;right:8px;bottom:8px;height:38px;border-radius:14px;background:rgba(16,24,35,.92);border:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;font-size:7.5px;color:#6E8197;font-family:var(--font-display);font-weight:600}
.tk-tabs span::before{content:"";display:block;width:12px;height:12px;margin:0 auto 2px;border-radius:4px;border:1.5px solid currentColor}
.tk-tabs span.on{color:#5EE6B0}
.figma-embed{width:100%;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:var(--r-sm);background:#0A0F16}

/* sector marquee */
.marquee-wrap{padding-block:8px clamp(24px,4vw,40px)}
.marquee-label{text-align:center;margin-bottom:14px}
.marquee{position:relative;overflow:hidden;border-radius:999px;padding-block:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marquee-track{display:flex;width:max-content;animation:marquee 34s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee ul{display:flex;list-style:none;margin:0;padding:0}
.marquee li{display:flex;align-items:center;gap:12px;padding:0 34px;font-family:var(--font-display);font-weight:700;font-size:clamp(.95rem,.85rem + .5vw,1.2rem);letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.marquee li svg{width:26px;height:26px;color:var(--tide);flex:none}
.marquee li::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--sea);margin-left:22px;box-shadow:0 0 10px var(--glow)}
@keyframes marquee{to{transform:translateX(-50%)}}

/* portfolio: experience */
.cv-layout{align-items:start}
@media (min-width:980px){
  .cv-layout .timeline-col{grid-column:1/span 7}
  .cv-layout .side-col{grid-column:8/span 5}
}
.sub-h{font-size:var(--step-2);font-weight:700;letter-spacing:-.025em;margin-bottom:20px}
.timeline{list-style:none;margin:0;padding:0 0 0 28px;position:relative;display:grid;gap:14px}
.timeline::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:1px;background:linear-gradient(var(--tide),rgba(18,101,163,.1))}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-26px;top:28px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--tide);box-shadow:0 0 12px var(--glow)}
.xp{padding:20px 24px}
.xp-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.xp h4{font-size:var(--step-1);font-weight:700;letter-spacing:-.015em;line-height:1.3}

          <h3>Disciplines</h3>
          ${cats.map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="false"><span>${esc(c)}</span><span class="count">${skills.filter(s => s.category === c).length}</span></button>`).join("")}
          <p class="hint">Select a discipline again to clear it.</p>
        </div>
      </div>
      <p class="ring-key"><span><i></i>Skills, outer ring</span><span><i class="sq"></i>Tools, inner ring</span></p>
    </div>`;
  const ring = $("#ring"), center = $("#ringCenter");
  let pinned = null, activeCat = null;
  const showSkill = i => {
    $$(".ico", ring).forEach(b => b.classList.toggle("on", Number(b.dataset.i) === i));
    if (i == null) {
      center.innerHTML = activeCat
        ? `<span class="cat">${esc(activeCat)}</span><span class="big">${skills.filter(s => s.category === activeCat).length} ${activeCat === "Tools" ? "tools" : "skills"}</span>`
        : defaultCenter;
      return;
    }
    const s = skills[i];
    center.innerHTML = `<span class="cat">${esc(s.category)}</span><span class="big">${esc(s.name)}</span>`;
  };
  ring.addEventListener("pointerover", e => { const b = e.target.closest(".ico"); if (b) showSkill(Number(b.dataset.i)); });
  ring.addEventListener("pointerout", e => { const b = e.target.closest(".ico"); if (b && !b.contains(e.relatedTarget)) showSkill(pinned); });
  ring.addEventListener("focusin", e => { const b = e.target.closest(".ico"); if (b) showSkill(Number(b.dataset.i)); });
  ring.addEventListener("focusout", () => showSkill(pinned));
  ring.addEventListener("click", e => {
    const b = e.target.closest(".ico"); if (!b) return;
    const i = Number(b.dataset.i);
    pinned = pinned === i ? null : i; showSkill(pinned ?? i);
  });
  const setCat = c => {
    activeCat = c;
    ring.classList.toggle("filtering", !!c);
    $$(".ico", ring).forEach(b => b.classList.toggle("in-cat", b.dataset.cat === c));
    $$(".legend button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cat === c)));
    pinned = null; showSkill(null);
  };
  $$(".legend button").forEach(b => b.addEventListener("click", () => setCat(activeCat === b.dataset.cat ? null : b.dataset.cat)));

  /* ---------- AI workflow ---------- */
  const A = SITE.ai;
  $("#aiMount").innerHTML = `
    <div class="grid12 ai-grid">
      <div class="ai-left" data-reveal>
        <p class="eyebrow">AI Workflow</p>
        <h2 class="h2" id="aiTitle" style="margin-top:14px">${hl(A.heading)}</h2>
        <p class="ai-copy">${esc(A.copy)}</p>
      </div>
      <div class="ai-right">
        <ol class="steps snap">
          ${A.steps.map((s, i) => `<li class="step glass sheen" data-reveal>
            <span class="num">${String(i + 1).padStart(2, "0")}</span>
            <h3>${esc(s.name)}</h3>
            <div class="row ai"><span>AI helps</span><p>${esc(s.ai)}</p></div>
            <div class="row"><span>I decide</span><p>${esc(s.human)}</p></div>
          </li>`).join("")}
        </ol>
        <p class="snap-hint">Swipe to see all six steps.</p>
      </div>
    </div>`;

  /* ---------- advisory ---------- */
  const V = SITE.advisory;
  $("#advMount").innerHTML = `
    <div class="section-head" data-reveal>
      <p class="eyebrow">Advisory and retainers</p>
      <h2 class="h2" id="advTitle">${hl(V.heading)}</h2>
      <p class="lead">${esc(V.lead)}</p>
    </div>
    <div class="services snap">
      ${V.services.map(s => `<article class="service glass sheen${s.featured ? " featured liquid" : ""}" data-reveal>
        <p class="format">${esc(s.format)}</p>
        <h3>${esc(s.name)}</h3>
        <p>${esc(s.description)}</p>
        <div class="suits"><strong>Suits</strong><p>${esc(s.suits)}</p></div>
        <div class="service-foot">
          <p class="price"><small>${esc(V.pricingLabel)}</small>${esc(V.pricing)}</p>
          ${s.booking
            ? `<a class="btn btn-primary btn-sm" href="${esc(SITE.calendly)}" target="_blank" rel="noopener" aria-label="Book a ${esc(s.name)} on Calendly">Book now</a>`
            : `<a class="btn btn-primary btn-sm" href="#contact" data-service="${esc(s.name)}" aria-label="Enquire about ${esc(s.name)}">Enquire</a>`}
        </div>
      </article>`).join("")}
    </div>
    <p class="snap-hint">Swipe to see all four options.</p>`;

  /* ---------- contact ---------- */
  const K = SITE.contact;
  $("#ctMount").innerHTML = `
    <div class="section-head" data-reveal>
      <p class="eyebrow">Contact</p>
      <h2 class="h2" id="ctTitle">${hl(K.heading)}</h2>
      <p class="lead">${esc(K.lead)}</p>
    </div>
    <div class="grid12 contact-layout">
      <div class="form-col">
        <form class="form glass lg liquid" id="contactForm" novalidate>
          <div class="form-row">
            <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="e-name"><span class="err" id="e-name"></span></div>
            <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required aria-describedby="e-email"><span class="err" id="e-email"></span></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="f-org">Organisation <span class="opt">(optional)</span></label><input id="f-org" name="organisation" type="text" autocomplete="organization"></div>
            <div class="field"><label for="f-budget">Budget range <span class="opt">(optional)</span></label>
              <select id="f-budget" name="budget"><option value="">Select a range</option>${K.budgets.map(b => `<option>${esc(b)}</option>`).join("")}</select></div>
          </div>
          <div class="field"><label for="f-need">What you need</label><textarea id="f-need" name="need" required aria-describedby="e-need" placeholder="A few lines on the project, the timeline and what success looks like."></textarea><span class="err" id="e-need"></span></div>
          <div id="formStatus" class="form-status" role="status" aria-live="polite" hidden></div>
          <div class="form-actions">
            <small>Your details are used only to reply to you.</small>
            <button class="btn btn-primary" type="submit" id="f-submit">Send message ${icon("arrow", 2)}</button>
          </div>
        </form>
      </div>
      <div class="links-col">
        <div class="links-card glass sheen">
          <a class="btn btn-primary" href="${esc(SITE.calendly)}" target="_blank" rel="noopener">${icon("cal", 1.8)} ${esc(SITE.primaryCta)}</a>
          <a class="btn btn-ghost" href="${esc(K.whatsapp.link)}" target="_blank" rel="noopener">${WA} Chat on WhatsApp</a>
          <div class="link-row"><div><span class="k">Email</span><span class="v" id="emailText">${esc(K.email)}</span></div><button class="copy" type="button" id="copyEmail">Copy</button></div>
          <a class="link-row" href="${esc(K.linkedin.link)}" target="_blank" rel="noopener"><div><span class="k">LinkedIn</span><span class="v">${esc(K.linkedin.display)}</span></div>${icon("ext", 2)}</a>
          <a class="link-row" href="${esc(K.instagram.link)}" target="_blank" rel="noopener"><div><span class="k">Instagram</span><span class="v">${esc(K.instagram.display)}</span></div>${icon("ext", 2)}</a>
        </div>
      </div>
    </div>`;

  const need = $("#f-need");
  const goToForm = text => {
    if (text) need.value = text;
    $("#contact").scrollIntoView({ behavior: reduceMQ.matches ? "auto" : "smooth", block: "start" });
    setTimeout(() => { need.focus({ preventScroll: true }); need.setSelectionRange(need.value.length, need.value.length); }, reduceMQ.matches ? 0 : 650);
  };
  document.addEventListener("click", e => {
    const req = e.target.closest("[data-request]");
    if (req) { e.preventDefault(); closeModal(); goToForm(`Request details: ${req.dataset.request}\n\n`); return; }
    const sim = e.target.closest("[data-request-similar]");
    if (sim) { e.preventDefault(); closeModal(); goToForm(`I would like to discuss a project similar to "${sim.dataset.requestSimilar}".\n\n`); return; }
    const svc = e.target.closest("[data-service]");
    if (svc) { e.preventDefault(); goToForm(`Enquiry: ${svc.dataset.service}\n\n`); return; }
    const open = e.target.closest("[data-project]");
    if (open) { const p = SITE.projects.find(x => x.id === open.dataset.project); if (p) openProject(p, open); }
  });

  $("#copyEmail").addEventListener("click", async e => {
    const btn = e.currentTarget;
    try { await navigator.clipboard.writeText(K.email); btn.textContent = "Copied"; }
    catch (_) { const r = document.createRange(); r.selectNodeContents($("#emailText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; }
    setTimeout(() => (btn.textContent = "Copy"), 1800);
  });

  const form = $("#contactForm"), status = $("#formStatus");
  const setErr = (id, msg) => { $("#f-" + id).setAttribute("aria-invalid", msg ? "true" : "false"); $("#e-" + id).textContent = msg; };
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    const okName = !!d.name.trim(), okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim()), okNeed = !!d.need.trim();
    setErr("name", okName ? "" : "Add your name so I know who to reply to.");
    setErr("email", okEmail ? "" : "Add an email address in the form name@example.com.");
    setErr("need", okNeed ? "" : "Add a line or two about what you need.");
    const bad = !okName ? "name" : !okEmail ? "email" : !okNeed ? "need" : null;
    if (bad) { $("#f-" + bad).focus(); return; }
    status.hidden = false; status.className = "form-status";
    if (!K.formEndpoint) {
      status.innerHTML = `This form is not connected yet. Please email <strong>${esc(K.email)}</strong> or use the WhatsApp button.`;
      return;
    }
    const btn = $("#f-submit"); btn.disabled = true; status.textContent = "Sending your message.";
    try {
      const res = await fetch(K.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(d) });
      if (!res.ok) throw new Error(res.status);
      status.className = "form-status ok";
      status.textContent = `Thank you, ${d.name.trim().split(" ")[0]}. Your message has arrived and I will reply within two working days.`;
      form.reset();
    } catch (_) {
      status.innerHTML = `Your message did not go through. Please try again, or email <strong>${esc(K.email)}</strong>.`;
    } finally { btn.disabled = false; }
  });

  /* ---------- footer ---------- */
  $("#footMount").innerHTML = `${logoHTML}<span>&copy; ${new Date().getFullYear()} ${esc(SITE.footer.owner)}. All rights reserved.</span>`;

  /* ---------- cursor sheen ---------- */
  document.addEventListener("pointermove", e => {
    const el = e.target.closest && e.target.closest(".sheen");
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", `${e.clientX - r.left}px`);
    el.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive: true });

  /* ---------- active nav link ---------- */
  const navLinks = $$(".nav a");
  const spy = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) navLinks.forEach(a => a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + en.target.id)));
  }), { rootMargin: "-45% 0px -50% 0px" });
  SITE.nav.forEach(n => { const s = document.querySelector(n.href); if (s) spy.observe(s); });

  /* ---------- motion preferences ---------- */
  const applyMotion = () => {
    const svg = document.getElementById("liquidAnim");
    if (svg && svg.ownerSVGElement) { try { reduceMQ.matches ? svg.ownerSVGElement.pauseAnimations() : svg.ownerSVGElement.unpauseAnimations(); } catch (_) {} }
  };
  applyMotion();
  reduceMQ.addEventListener ? reduceMQ.addEventListener("change", applyMotion) : reduceMQ.addListener(applyMotion);

  /* ---------- fade-ups for content below the first screen ---------- */
  if (!reduceMQ.matches && "IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.remove("pre"); io.unobserve(en.target); }
    }), { rootMargin: "0px 0px -8% 0px" });
    $$("[data-reveal]").forEach(el => {
      if (el.getBoundingClientRect().top > window.innerHeight) { el.classList.add("pre", "reveal-in"); io.observe(el); }
    });
  }
})();
</script>
</body>
</html>
